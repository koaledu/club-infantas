name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          docker build -t club-infantas .
          docker run --rm -v "$PWD:/src" club-infantas zine release

      - name: Check local links and metadata
        run: python3 scripts/check_links.py public
